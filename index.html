
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>追星歷程記錄</title>
    <!-- 使用 CDN 載入 Tailwind 以簡化設定 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              korean: {
                bg: '#FDFCFB',
                card: '#FFFFFF',
                sage: '#96A291',
                rose: '#D9A7A7',
                sand: '#EAE3D9',
                stone: '#4A4A4A',
                muted: '#8E8E8E',
                border: '#F1EDE9'
              }
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '2.5rem'
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Quicksand:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Quicksand', 'Noto Sans TC', sans-serif;
        -webkit-tap-highlight-color: transparent;
        background-color: #FDFCFB; /* Soft warm white */
        color: #4A4A4A;
      }

      /* Custom animations */
      @keyframes popIn {
        0% { transform: scale(0.98); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      /* Hide scrollbar for cleaner modals */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #EAE3D9;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D9CFC1;
      }

      /* Soft focus ring */
      *:focus-visible {
        outline: 2px solid #96A291;
        outline-offset: 2px;
      }
    </style>
